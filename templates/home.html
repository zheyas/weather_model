<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоды - Оренбург</title>

<style>
/* Взяты стили из присланного примера (без изменений по смыслу) */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  background:linear-gradient(135deg,#1e3c72 0%,#2a5298 25%,#4a90e2 50%,#74b9ff 75%,#a29bfe 100%);
  background-size:400% 400%; animation:gradientShift 20s ease infinite;
  min-height:100vh; color:#fff; overflow-x:hidden;
}
@keyframes gradientShift{
  0%{background-position:0% 50%}25%{background-position:100% 0%}
  50%{background-position:100% 100%}75%{background-position:0% 100%}
  100%{background-position:0% 50%}
}
.container{max-width:1200px;margin:0 auto;padding:20px}
.header{text-align:center;margin-bottom:40px}
.header h1{font-size:2.5rem;margin-bottom:10px;text-shadow:2px 2px 4px rgba(0,0,0,.3)}
.header p{font-size:1.2rem;opacity:.9}
.main-content{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-bottom:40px}

.weather-card{
  background:linear-gradient(145deg, rgba(255,255,255,.25), rgba(255,255,255,.1));
  backdrop-filter:blur(20px);
  border-radius:25px; padding:35px;
  border:2px solid rgba(255,255,255,.3);
  box-shadow:0 15px 35px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.4);
  transition:all .4s cubic-bezier(.23,1,.32,1);
  position:relative; overflow:hidden;
}
.weather-card::before{
  content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  transition:left .5s;
}
.weather-card:hover::before{left:100%}
.weather-card:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 25px 50px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.5);
}
.current-weather{text-align:center}
.weather-icon{
  font-size:5rem; margin:25px 0; animation:floatSun 3s ease-in-out infinite;
  filter:drop-shadow(0 0 20px rgba(255,255,0,.3)); transition:all .3s ease;
}
.weather-icon:hover{transform:scale(1.2) rotate(15deg); filter:drop-shadow(0 0 30px rgba(255,255,0,.6))}
@keyframes floatSun{
  0%,100%{transform:translateY(0) rotate(0); filter:drop-shadow(0 0 20px rgba(255,255,0,.3))}
  50%{transform:translateY(-15px) rotate(5deg); filter:drop-shadow(0 0 25px rgba(255,255,0,.5))}
}
.temperature{font-size:3rem;font-weight:bold;margin:10px 0}

.weather-details{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}
.detail-item{
  background:linear-gradient(145deg, rgba(255,255,255,.15), rgba(255,255,255,.05));
  backdrop-filter:blur(10px); padding:18px; border-radius:15px; text-align:center;
  border:1px solid rgba(255,255,255,.2);
  transition:all .3s cubic-bezier(.23,1,.32,1);
  position:relative; overflow:hidden;
}
.detail-item::before{
  content:''; position:absolute; inset:0; left:-100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);
  transition:left .5s;
}
.detail-item:hover::before{left:100%}
.detail-item:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.2); border-color:rgba(255,255,255,.3)}
.detail-label{font-size:.9rem;opacity:.8;margin-bottom:5px}
.detail-value{font-size:1.2rem;font-weight:bold}

.calendar-section{
  background:rgba(255,255,255,.15); backdrop-filter:blur(10px);
  border-radius:20px; padding:30px; border:1px solid rgba(255,255,255,.2);
}
.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.calendar-nav{
  background:linear-gradient(145deg, rgba(116,185,255,.4), rgba(74,144,226,.3));
  border:2px solid rgba(116,185,255,.5); color:#fff; padding:12px 18px; border-radius:15px; cursor:pointer;
  transition:all .4s cubic-bezier(.23,1,.32,1); font-size:1.2rem; font-weight:bold; backdrop-filter:blur(10px);
  box-shadow:0 8px 25px rgba(30,60,114,.2); position:relative; overflow:hidden; text-shadow:0 1px 2px rgba(0,0,0,.3);
}
.calendar-nav::before{
  content:''; position:absolute; top:50%; left:50%;
width:0; height:0;
  background:radial-gradient(circle, rgba(162,155,254,.4) 0%, transparent 70%);
  transition:all .4s ease; transform:translate(-50%,-50%);
}
.calendar-nav:hover::before{width:100px;height:100px}
.calendar-nav:hover{
  background:linear-gradient(145deg, rgba(162,155,254,.5), rgba(116,185,255,.4));
  transform:translateY(-3px) scale(1.08);
  box-shadow:0 15px 35px rgba(30,60,114,.3); border-color:rgba(162,155,254,.6);
}
.calendar-nav:active{transform:translateY(-1px) scale(1.05)}

.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:20px}
.calendar-day{
  aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(145deg, rgba(255,255,255,.15), rgba(255,255,255,.05));
  border-radius:12px; cursor:pointer; transition:all .4s cubic-bezier(.23,1,.32,1);
  font-size:.95rem; font-weight:500; border:1px solid rgba(255,255,255,.2); backdrop-filter:blur(5px);
  position:relative; overflow:hidden;
}
.calendar-day::before{
  content:''; position:absolute; inset:0;
  background:radial-gradient(circle at center, rgba(255,255,255,.2) 0%, transparent 70%);
  opacity:0; transition:opacity .3s ease;
}
.calendar-day:hover::before{opacity:1}
.calendar-day:hover{
  background:linear-gradient(145deg, rgba(255,255,255,.3), rgba(255,255,255,.15));
  transform:translateY(-2px) scale(1.05);
  box-shadow:0 8px 20px rgba(0,0,0,.2); border-color:rgba(255,255,255,.4);
}
.calendar-day.selected{
  background:linear-gradient(145deg,#4CAF50,#45a049);
  box-shadow:0 0 25px rgba(76,175,80,.6),0 8px 20px rgba(0,0,0,.3);
  border-color:rgba(255,255,255,.6); transform:scale(1.1);
}
.calendar-day.selected:hover{transform:translateY(-2px) scale(1.15)}
.calendar-day.other-month{opacity:.3}

.forecast-range{margin-top:20px}
.range-label{margin-bottom:10px;font-weight:bold}
.range-slider{
  width:100%; height:12px; border-radius:25px;
  background:linear-gradient(90deg, rgba(255,255,255,.2), rgba(255,255,255,.4));
  outline:none; -webkit-appearance:none; backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.3); box-shadow:inset 0 2px 5px rgba(0,0,0,.2);
}
.range-slider::-webkit-slider-thumb{
  -webkit-appearance:none; width:28px; height:28px; border-radius:50%;
  background:linear-gradient(145deg,#4CAF50,#45a049); cursor:pointer;
  box-shadow:0 0 20px rgba(76,175,80,.6), 0 4px 15px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3);
  border:3px solid rgba(255,255,255,.8); transition:all .3s cubic-bezier(.23,1,.32,1);
}
.range-slider::-webkit-slider-thumb:hover{transform:scale(1.2); box-shadow:0 0 30px rgba(76,175,80,.8),0 6px 20px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.4)}
.range-slider::-webkit-slider-thumb:active{transform:scale(1.1)}
.range-slider::-moz-range-thumb{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(145deg,#4CAF50,#45a049); cursor:pointer;
  box-shadow:0 0 20px rgba(76,175,80,.6),0 4px 15px rgba(0,0,0,.3);
  border:3px solid rgba(255,255,255,.8); transition:all .3s ease;
}

.forecast-timeline{
  background:rgba(255,255,255,.15); backdrop-filter:blur(10px);
  border-radius:20px; padding:30px; border:1px solid rgba(255,255,255,.2);
}
.timeline-header{text-align:center;margin-bottom:30px}

.forecast-table-container{
  overflow-x:auto; border-radius:15px;
  background:linear-gradient(145deg, rgba(255,255,255,.1), rgba(255,255,255,.05));
  backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.2);
}
.forecast-table{width:100%; border-collapse:collapse; font-size:.95rem}
.forecast-table th{
  background:linear-gradient(145deg, rgba(30,60,114,.8), rgba(42,82,152,.6));
  padding:18px 15px; text-align:left; font-weight:600; border-bottom:2px solid rgba(116,185,255,.4);
  color:#fff; font-size:.9rem; text-transform:uppercase; letter-spacing:.5px; text-shadow:0 1px 2px rgba(0,0,0,.3)
}
.forecast-table td{padding:16px 15px; border-bottom:1px solid rgba(116,185,255,.2); transition:all .3s ease; position:relative; color:#f8f9fa}
.forecast-table tr{transition:all .3s cubic-bezier(.23,1,.32,1); position:relative}
.forecast-table tr::before{
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg, rgba(116,185,255,.1), rgba(162,155,254,.15), rgba(116,185,255,.1));
  opacity:0; transition:opacity .3s ease
}
.forecast-table tr:hover::before{opacity:1}
.forecast-table tr:hover{transform:scale(1.01); box-shadow:0 8px 25px rgba(30,60,114,.3)}
.forecast-table tr:hover td{color:#fff}
.date-cell{font-weight:600;color:#74b9ff;text-shadow:0 0 10px rgba(116,185,255,.5)}
.temp-cell{font-weight:600;font-size:1.1rem}
.min-temp{color:#74b9ff;font-weight:500}
.max-temp{color:#fd79a8;font-weight:600}
.feels-like{color:#fdcb6e;font-weight:500}
.precipitation{color:#81ecec;font-weight:500}
.wind-speed{color:#a29bfe;font-weight:500}
.weather-icon-small{font-size:1.5rem;margin-right:8px;vertical-align:middle;display:inline-block;animation:weatherPulse 2s ease-in-out infinite}
@keyframes weatherPulse{
  0%,100%{transform:scale(1) rotate(0); filter:drop-shadow(0 0 5px rgba(116,185,255,.3))}
  50%{transform:scale(1.1) rotate(2deg); filter:drop-shadow(0 0 10px rgba(116,185,255,.6))}
}
.weather-icon-small.rain{animation:rainDrop 1.5s ease-in-out infinite}
.weather-icon-small.snow{animation:snowFall 3s ease-in-out infinite}
.weather-icon-small.sun{animation:sunRotate 4s linear infinite}
.weather-icon-small.cloud{animation:cloudFloat 3s ease-in-out infinite}
@keyframes rainDrop{0%,100%{transform:translateY(0) scale(1); filter:drop-shadow(0 0 5px rgba(129,236,236,.4))}50%{transform:translateY(-3px) scale(1.05); filter:drop-shadow(0 0 8px rgba(129,236,236,.7))}}
@keyframes snowFall{
  0%,100%{transform:translateY(0) rotate(0) scale(1); filter:drop-shadow(0 0 5px rgba(255,255,255,.4))}
  33%{transform:translateY(-2px) rotate(120deg) scale(1.1); filter:drop-shadow(0 0 8px rgba(255,255,255,.6))}
  66%{transform:translateY(1px) rotate(240deg) scale(.95); filter:drop-shadow(0 0 6px rgba(255,255,255,.5))}
}
@keyframes sunRotate{
  0%{transform:rotate(0) scale(1); filter:drop-shadow(0 0 8px rgba(253,203,110,.5))}
  25%{transform:rotate(90deg) scale(1.05); filter:drop-shadow(0 0 12px rgba(253,203,110,.7))}
  50%{transform:rotate(180deg) scale(1); filter:drop-shadow(0 0 8px rgba(253,203,110,.5))}
  75%{transform:rotate(270deg) scale(1.05); filter:drop-shadow(0 0 12px rgba(253,203,110,.7))}
  100%{transform:rotate(360deg) scale(1); filter:drop-shadow(0 0 8px rgba(253,203,110,.5))}
}
@keyframes cloudFloat{0%,100%{transform:translateX(0) scale(1); filter:drop-shadow(0 0 5px rgba(162,155,254,.3))}50%{transform:translateX(2px) scale(1.02); filter:drop-shadow(0 0 8px rgba(162,155,254,.5))}}

.timeline-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin-top:30px}
.timeline-day {
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
    backdrop-filter: blur(15px);
    padding: 20px;
    border-radius: 20px;
    text-align: center;
    transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
    border: 2px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    position: relative;
    overflow: hidden;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.timeline-day::before{content:''; position:absolute; inset:0; background:linear-gradient(135deg, rgba(255,255,255,.1), transparent); opacity:0; transition:opacity .3s ease}
.timeline-day:hover::before{opacity:1}
.timeline-day:hover{transform:translateY(-8px) scale(1.03); box-shadow:0 20px 40px rgba(0,0,0,.25); border-color:rgba(255,255,255,.4)}
.timeline-date{font-size:.9rem;opacity:.8;margin-bottom:10px}
.timeline-icon{font-size:2rem;margin:10px 0;display:inline-block;animation:timelineWeatherFloat 3s ease-in-out infinite; filter:drop-shadow(0 0 10px rgba(116,185,255,.4))}
@keyframes timelineWeatherFloat{0%,100%{transform:translateY(0) scale(1); filter:drop-shadow(0 0 10px rgba(116,185,255,.4))}50%{transform:translateY(-5px) scale(1.05); filter:drop-shadow(0 0 15px rgba(116,185,255,.6))}}
.timeline-temp{font-size:1.3rem;font-weight:bold}

.floating-clouds{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.cloud{position:absolute;color:rgba(255,255,255,.08);font-size:3rem;animation:float 25s infinite linear;filter:blur(1px)}
.particle{position:absolute;width:4px;height:4px;background:rgba(255,255,255,.6);border-radius:50%;animation:sparkle 8s infinite ease-in-out}
@keyframes float{0%{transform:translateX(-100px) translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(calc(100vw + 100px)) translateY(-20px);opacity:0}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0) rotate(0)}50%{opacity:1;transform:scale(1) rotate(180deg)}}
.cloud:nth-child(1){top:15%;animation-delay:0s}.cloud:nth-child(2){top:35%;animation-delay:-8s}.cloud:nth-child(3){top:65%;animation-delay:-16s}.cloud:nth-child(4){top:80%;animation-delay:-12s}
.particle:nth-child(5){top:20%;left:10%;animation-delay:0s}.particle:nth-child(6){top:40%;left:30%;animation-delay:-2s}.particle:nth-child(7){top:60%;left:70%;animation-delay:-4s}.particle:nth-child(8){top:80%;left:50%;animation-delay:-6s}

@media (max-width:768px){
  .container{padding:15px}
  .header h1{font-size:2rem}
  .main-content{grid-template-columns:1fr;gap:20px}
  .weather-card{padding:20px}
  .temperature{font-size:2.5rem}
  .weather-details{grid-template-columns:1fr}
  .timeline-days{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:15px}
  .calendar-grid{gap:3px}
  .calendar-day{font-size:.8rem}
  .forecast-table{font-size:.85rem}
  .forecast-table th,.forecast-table td{padding:12px 8px}
  .forecast-table th{font-size:.8rem}
  .weather-icon-small{font-size:1.2rem}
}
@media (max-width:480px){
  .header h1{font-size:1.8rem}
  .weather-icon{font-size:3rem}
  .temperature{font-size:2rem}
  .timeline-days{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
    <div class="floating-clouds">
        <div class="cloud">☁️</div>
        <div class="cloud">☁️</div>
        <div class="cloud">☁️</div>
        <div class="cloud">☁️</div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <header class="header">
            <h1>🌤️ Прогноз погоды</h1>
            <p>Оренбург, Россия</p>
        </header>

        <div class="main-content">
            <div class="weather-card current-weather">
                <h2>Сейчас</h2>
                <div class="weather-icon" id="currentIcon">☀️</div>
                <div class="temperature" id="currentTemp">+18°C</div>
                <p id="currentDescription">Солнечно</p>

                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-label">Влажность</div>
                        <div class="detail-value" id="humidity">65%</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Ветер</div>
                        <div class="detail-value" id="wind">12 км/ч</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Давление</div>
                        <div class="detail-value" id="pressure">1013 гПа</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Видимость</div>
                        <div class="detail-value" id="visibility">10 км</div>
                    </div>
                </div>
            </div>

            <div class="calendar-section">
                <div class="calendar-header">
                    <button class="calendar-nav" onclick="changeMonth(-1)">‹</button>
                    <h3 id="currentMonth">Декабрь 2024</h3>
                    <button class="calendar-nav" onclick="changeMonth(1)">›</button>
                </div>

                <div class="calendar-grid" id="calendarGrid">
                    <!-- Календарь будет сгенерирован JavaScript -->
                </div>

                <div class="forecast-range">
                    <div class="range-label">Дальность прогноза: <span id="rangeValue">7</span> дней</div>
                    <input type="range" class="range-slider" min="1" max="30" value="7" id="forecastRange" oninput="updateForecastRange(this.value)">
                </div>
            </div>
        </div>

        <div class="forecast-timeline">
            <div class="timeline-header">
                <h2>Прогноз на <span id="forecastDays">7</span> дней</h2>
            </div>

            <div class="forecast-table-container">
                <table class="forecast-table" id="forecastTable">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Прогноз</th>
                            <th>Минимум</th>
                            <th>Максимум</th>
                            <th>По ощущениям</th>
                            <th>Осадки</th>
                            <th>Скорость ветра</th>
                        </tr>
                    </thead>
                    <tbody id="forecastTableBody">
                        <!-- Данные будут сгенерированы JavaScript -->
                    </tbody>
                </table>
            </div>

            <div class="timeline-days" id="timelineDays">
                <!-- Прогноз будет сгенерирован JavaScript -->
            </div>
        </div>
    </div>

<script>
    // Конфигурация API
    const API_BASE_URL = window.location.origin;
    let currentDate = new Date();
    let selectedDate = new Date();
    let forecastRange = 7;

    // Кэш данных
    const cache = {
        weather: null,
        forecast: {},
        lastUpdate: null
    };

    // Функции для работы с API
    async function fetchCurrentWeather() {
        try {
            // Проверяем кэш (данные не старше 10 минут)
            if (cache.weather && Date.now() - cache.weather.timestamp < 10 * 60 * 1000) {
                return cache.weather.data;
            }

            const response = await fetch(`${API_BASE_URL}/api/weather`);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const data = await response.json();

            // Сохраняем в кэш
            cache.weather = {
                data: data,
                timestamp: Date.now()
            };

            return data;
        } catch (error) {
            console.error('Ошибка получения текущей погоды:', error);
            showNotification('Ошибка загрузки текущей погоды', 'error');
            return null;
        }
    }

    async function fetchWeatherForecast(startDate, days) {
        const cacheKey = `${startDate}-${days}`;

        // Проверяем кэш (данные не старше 10 минут)
        if (cache.forecast[cacheKey] && Date.now() - cache.forecast[cacheKey].timestamp < 10 * 60 * 1000) {
            return cache.forecast[cacheKey].data;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/api/forecast?date=${startDate}&days=${days}`);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const data = await response.json();

            // Сохраняем в кэш
            cache.forecast[cacheKey] = {
                data: data,
                timestamp: Date.now()
            };

            return data;
        } catch (error) {
            console.error('Ошибка получения прогноза:', error);
            showNotification('Ошибка загрузки данных прогноза', 'error');
            return null;
        }
    }

    // Функция показа уведомлений
    function showNotification(message, type = 'info') {
        // Создаем элемент уведомления
        const notification = document.createElement('div');
        notification.className = `notification ${type}`;
        notification.innerHTML = `
            <span>${message}</span>
            <button onclick="this.parentElement.remove()">×</button>
        `;

        // Стили для уведомлений
        if (!document.querySelector('.notification-style')) {
            const style = document.createElement('style');
            style.className = 'notification-style';
            style.textContent = `
                .notification {
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    padding: 15px 20px;
                    border-radius: 5px;
                    color: white;
                    z-index: 1000;
                    max-width: 300px;
                    animation: slideIn 0.3s ease;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                }
                .notification.error { background: #ff6b6b; }
                .notification.info { background: #4ecdc4; }
                .notification.success { background: #51cf66; }
                .notification button {
                    background: none;
                    border: none;
                    color: white;
                    font-size: 18px;
                    cursor: pointer;
                    margin-left: 10px;
                    padding: 0;
                    width: 20px;
                    height: 20px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }
                @keyframes slideIn {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
            `;
            document.head.appendChild(style);
        }

        document.body.appendChild(notification);

        // Автоматическое удаление через 5 секунд
        setTimeout(() => {
            if (notification.parentElement) {
                notification.remove();
            }
        }, 5000);
    }

    // Функция показа индикатора загрузки
    function showLoading(show = true) {
        let loader = document.getElementById('loadingIndicator');

        if (show && !loader) {
            loader = document.createElement('div');
            loader.id = 'loadingIndicator';
            loader.innerHTML = `
                <div class="loading-spinner"></div>
                <div>Загрузка данных...</div>
            `;

            const style = document.createElement('style');
            style.textContent = `
                #loadingIndicator {
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: rgba(255,255,255,0.95);
                    padding: 30px;
                    border-radius: 15px;
                    z-index: 9999;
                    text-align: center;
                    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
                    border: 1px solid #e0e0e0;
                    font-family: inherit;
                    min-width: 150px;
                }
                .loading-spinner {
                    border: 4px solid #f3f3f3;
                    border-top: 4px solid #4ecdc4;
                    border-radius: 50%;
                    width: 40px;
                    height: 40px;
                    animation: spin 1s linear infinite;
                    margin: 0 auto 15px;
                }
                @keyframes spin {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                }
            `;
            document.head.appendChild(style);
            document.body.appendChild(loader);
        } else if (!show && loader) {
            loader.remove();
        }
    }

    // Функции отображения данных
    async function updateCurrentWeather() {
        const weatherData = await fetchCurrentWeather();

        if (weatherData && !weatherData.ошибка) {
            document.getElementById('currentTemp').textContent = weatherData.температура;
            document.getElementById('currentDescription').textContent = weatherData.погода;
            document.getElementById('humidity').textContent = weatherData.влажность;
            document.getElementById('wind').textContent = weatherData.ветер;
            document.getElementById('pressure').textContent = weatherData.давление;

            // Устанавливаем иконку в зависимости от погоды
            setWeatherIcon(weatherData.погода);
        } else {
            // Fallback данные при ошибке
            document.getElementById('currentTemp').textContent = '+18°C';
            document.getElementById('currentDescription').textContent = 'Солнечно';
            setWeatherIcon('ясно');
        }
    }

    function setWeatherIcon(weatherDescription) {
        const iconMap = {
            'ясно': '☀️',
            'преимущественно ясно': '🌤️',
            'переменная облачность': '⛅',
            'пасмурно': '☁️',
            'туман': '🌫️',
            'легкая морось': '🌦️',
            'умеренная морось': '🌧️',
            'сильная морось': '🌧️',
            'небольшой дождь': '🌦️',
            'умеренный дождь': '🌧️',
            'сильный дождь': '⛈️',
            'ливень': '⛈️',
            'снег': '❄️',
            'небольшой снег': '🌨️',
            'метель': '❄️🌪️'
        };

        const icon = iconMap[weatherDescription.toLowerCase()] || '☀️';
        document.getElementById('currentIcon').textContent = icon;
    }

    function getWeatherIconForTemperature(temp, precipitation) {
        if (precipitation > 0.5) return {icon: '🌧️', class: 'rain'};
        if (precipitation >= 0.1 and precipitation < 0.49) return {icon: '🌦️', class: 'rain'};
        if (temp < 0) return {icon: '❄️', class: 'snow'};
        if (temp < 10) return {icon: '⛅', class: 'cloud'};
        return {icon: '☀️', class: 'sun'};
    }

    // Календарные функции
    function generateCalendar() {
        const grid = document.getElementById('calendarGrid');
        const monthYear = document.getElementById('currentMonth');

        const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
                      'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

        monthYear.textContent = `${months[currentDate.getMonth()]} ${currentDate.getFullYear()}`;

        const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
        const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
        const startDate = new Date(firstDay);
        startDate.setDate(startDate.getDate() - firstDay.getDay());

        grid.innerHTML = '';

        // Заголовки дней недели
        const dayHeaders = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
        dayHeaders.forEach(day => {
            const dayElement = document.createElement('div');
            dayElement.className = 'calendar-day';
            dayElement.textContent = day;
            dayElement.style.fontWeight = 'bold';
            dayElement.style.cursor = 'default';
            grid.appendChild(dayElement);
        });

        // Дни месяца
        for (let i = 0; i < 42; i++) {
            const date = new Date(startDate);
            date.setDate(startDate.getDate() + i);

            const dayElement = document.createElement('div');
            dayElement.className = 'calendar-day';
            dayElement.textContent = date.getDate();

            if (date.getMonth() !== currentDate.getMonth()) {
                dayElement.classList.add('other-month');
            }

            if (date.toDateString() === selectedDate.toDateString()) {
                dayElement.classList.add('selected');
            }

            // Подсветка сегодняшней даты
            const today = new Date();
            if (date.toDateString() === today.toDateString()) {
                dayElement.classList.add('today');
            }

            dayElement.onclick = () => selectDate(date);
            grid.appendChild(dayElement);
        }
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        generateCalendar();
    }

    async function selectDate(date) {
        selectedDate = new Date(date);
        generateCalendar();
        await generateForecast();
    }

    function updateForecastRange(value) {
        forecastRange = parseInt(value);
        document.getElementById('rangeValue').textContent = value;
        document.getElementById('forecastDays').textContent = value;
        generateForecast();
    }

    // Основные функции генерации прогноза
    async function generateForecast() {
        showLoading(true);
        try {
            await generateForecastTable();
            await generateTimelineCards();
        } catch (error) {
            console.error('Ошибка генерации прогноза:', error);
            showNotification('Ошибка отображения прогноза', 'error');
        } finally {
            showLoading(false);
        }
    }

    async function generateForecastTable() {
        const tableBody = document.getElementById('forecastTableBody');
        tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Загрузка данных...</td></tr>';

        const startDateStr = selectedDate.toISOString().split('T')[0];
        const forecastData = await fetchWeatherForecast(startDateStr, forecastRange);

        if (!forecastData || forecastData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #ff6b6b;">Ошибка загрузки данных</td></tr>';
            return;
        }

        tableBody.innerHTML = '';

        forecastData.forEach(dayData => {
            // Парсим числовые значения из строк
            const avgTemp = parseFloat(dayData['Прогноз'].replace('°C', ''));
            const precipitation = parseFloat(dayData['Осадки'].replace(' мм', ''));
            const windSpeed = parseFloat(dayData['Скорость ветра'].replace(' м/с', ''));

            const weatherInfo = getWeatherIconForTemperature(avgTemp, precipitation);

            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="date-cell">${formatDate(dayData['Дата'])}</td>
                <td><span class="weather-icon-small ${weatherInfo.class}">${weatherInfo.icon}</span>${dayData['Прогноз']}</td>
                <td class="min-temp">${dayData['Минимум']}</td>
                <td class="max-temp">${dayData['Максимум']}</td>
                <td class="feels-like">${dayData['По ощущениям']}</td>
                <td class="precipitation">${dayData['Осадки']}</td>
                <td class="wind-speed">${dayData['Скорость ветра']}</td>
            `;

            tableBody.appendChild(row);
        });
    }

    function formatDate(dateString) {
        const date = new Date(dateString);
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);

        if (date.toDateString() === today.toDateString()) {
            return 'Сегодня';
        } else if (date.toDateString() === tomorrow.toDateString()) {
            return 'Завтра';
        } else {
            return date.toLocaleDateString('ru-RU', {
                weekday: 'short',
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
        }
    }

    function formatTimelineDate(date) {
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);

        if (date.toDateString() === today.toDateString()) {
            return 'Сегодня';
        } else if (date.toDateString() === tomorrow.toDateString()) {
            return 'Завтра';
        } else {
            const options = {
                weekday: 'short',
                day: 'numeric',
                month: 'short'
            };
            return date.toLocaleDateString('ru-RU', options);
        }
    }

    function formatTemperature(temp) {
        const sign = temp > 0 ? '+' : '';
        return `${sign}${temp.toFixed(1)}°C`;
    }

    // Функция для отображения реальных данных из API в карточках
    async function generateTimelineCards() {
        const container = document.getElementById('timelineDays');
        container.innerHTML = '<div style="text-align: center; width: 100%;">Загрузка данных...</div>';

        const startDateStr = selectedDate.toISOString().split('T')[0];
        const forecastData = await fetchWeatherForecast(startDateStr, forecastRange);

        if (!forecastData || forecastData.length === 0) {
            container.innerHTML = '<div style="text-align: center; width: 100%; color: #ff6b6b;">Ошибка загрузки данных</div>';
            return;
        }

        container.innerHTML = '';

        // Берем только первые 7 дней для карточек (или меньше, если forecastRange меньше)
        const daysToShow = Math.min(forecastRange, 30);

        for (let i = 0; i < daysToShow && i < forecastData.length; i++) {
            const dayData = forecastData[i];
            const date = new Date(dayData['Дата']);

            // Извлекаем среднюю температуру из данных API
            const avgTemp = parseFloat(dayData['Прогноз'].replace('°C', ''));
            const precipitation = parseFloat(dayData['Осадки'].replace(' мм', ''));

            // Получаем иконку погоды на основе температуры и осадков
            const weatherInfo = getWeatherIconForTemperature(avgTemp, precipitation);

            const dayElement = document.createElement('div');
            dayElement.className = 'timeline-day';

            dayElement.innerHTML = `
                <div class="timeline-date">${formatTimelineDate(date)}</div>
                <div class="timeline-icon ${weatherInfo.class}">${weatherInfo.icon}</div>
                <div class="timeline-temp">${formatTemperature(avgTemp)}</div>
                <div class="timeline-precipitation" style="font-size: 0.8rem; margin-top: 5px; opacity: 0.8;">
                    ${precipitation > 0 ? '💧 ' + precipitation.toFixed(1) + ' мм' : 'Без осадков'}
                </div>
            `;

            container.appendChild(dayElement);
        }
    }

    // Анимация иконки погоды
    function animateWeatherIcon() {
        const icon = document.getElementById('currentIcon');
        const icons = ['☀️', '🌤️', '⛅'];
        let currentIconIndex = 0;

        setInterval(() => {
            if (icon.textContent === '☀️') {
                currentIconIndex = (currentIconIndex + 1) % icons.length;
                icon.textContent = icons[currentIconIndex];

                setTimeout(() => {
                    icon.textContent = '☀️';
                }, 1000);
            }
        }, 5000);
    }

    // Обработчик изменения размера окна для адаптивности
    function handleResize() {
        const container = document.getElementById('timelineDays');
        const isMobile = window.innerWidth < 768;

        if (container) {
            if (isMobile) {
                container.style.overflowX = 'auto';
                container.style.flexWrap = 'nowrap';
                container.style.paddingBottom = '10px';
            } else {
                container.style.overflowX = 'visible';
                container.style.flexWrap = 'wrap';
                container.style.paddingBottom = '0';
            }
        }
    }

    // Функция для обновления времени последнего обновления
    function updateLastRefreshTime() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('ru-RU', {
            hour: '2-digit',
            minute: '2-digit'
        });
        const dateString = now.toLocaleDateString('ru-RU', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        });

        const element = document.getElementById('lastUpdateTime');
        if (element) {
            element.textContent = `Обновлено: ${dateString} в ${timeString}`;
        }
    }

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', async function() {
        showLoading(true);
        try {
            generateCalendar();
            await updateCurrentWeather();
            await generateForecast();
            animateWeatherIcon();
            handleResize();
            updateLastRefreshTime();

            showNotification('Приложение успешно загружено', 'success');
        } catch (error) {
            console.error('Ошибка инициализации:', error);
            showNotification('Ошибка загрузки приложения', 'error');
        } finally {
            showLoading(false);
        }

        // Обработчик изменения размера окна
        window.addEventListener('resize', handleResize);

        // Обновляем данные каждые 10 минут
        setInterval(async () => {
            await updateCurrentWeather();
            await generateForecast();
            updateLastRefreshTime();
            showNotification('Данные обновлены', 'info');
        }, 600000);

        // Добавляем кнопку принудительного обновления
        const refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) {
            refreshBtn.addEventListener('click', async () => {
                showLoading(true);
                try {
                    // Очищаем кэш для принудительного обновления
                    cache.weather = null;
                    cache.forecast = {};

                    await updateCurrentWeather();
                    await generateForecast();
                    updateLastRefreshTime();
                    showNotification('Данные обновлены вручную', 'success');
                } catch (error) {
                    console.error('Ошибка обновления:', error);
                    showNotification('Ошибка обновления данных', 'error');
                } finally {
                    showLoading(false);
                }
            });
        }
    });

    // Глобальные функции для использования в HTML
    window.changeMonth = changeMonth;
    window.updateForecastRange = updateForecastRange;
    window.selectDate = selectDate;
</script>

</body>
</html>
