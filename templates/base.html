<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Погодное приложение{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='6' y='48' font-size='44'%3E%F0%9F%8C%A4%3C/text%3E%3C/svg%3E">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">
        <span class="brand-ico">🌤</span>
        <span class="brand-name">WeatherApp</span>
      </a>
      <nav class="nav">
        <a href="/">Главная</a>
        <a href="#">Прогноз</a>
        <a href="#">Календарь</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="copy">© 2025 WeatherApp. Все права защищены.</div>
      <div class="made"><span class="pill">Сделано ❤️ на Flask и Python</span></div>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
